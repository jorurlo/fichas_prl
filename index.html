function save(){try{$$('input[type=checkbox]').forEach(c=>c.toggleAttribute('checked',c.checked));localStorage.setItem(K0+mid,JSON.stringify({t:Date.now(),h:doc.innerHTML,e:hd.checked}));$('#st').textContent='✔ Guardado'}catch(e){$('#st').textContent='⚠ No se pudo guardar (imágenes muy pesadas)'}}
function load(f,s){if(!f||!f.type.startsWith('image/'))return;const r=new FileReader;r.onload=()=>{const im=new Image;im.onload=()=>{const m=+s.dataset.max||1200,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d'),png=/png|webp/.test(f.type);if(!png){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}x.drawImage(im,0,0,c.width,c.height);$('img',s).src=c.toDataURL(png?'image/png':'image/jpeg',.82);s.classList.remove('empty');save()};im.src=r.result};r.readAsDataURL(f)}

save();return}
